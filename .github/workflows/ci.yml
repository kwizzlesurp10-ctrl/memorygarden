name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default token permissions across all jobs
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run test coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high and critical only)
        run: pnpm audit --audit-level high
        continue-on-error: true

  volatility-sentinel:
    name: Volatility Sentinel (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: volatility-sentinel/requirements.txt

      - name: Install deps and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r volatility-sentinel/requirements.txt

      - name: Run Python tests
        working-directory: volatility-sentinel
        run: pytest -q

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check bundle sizes
        run: |
          echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size (KB) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          find dist/assets -name '*.js' -exec sh -c 'size=$(wc -c < "$1"); echo "| $(basename "$1") | $((size / 1024)) |"' _ {} \; | sort -t'|' -k3 -rn >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Fail if a non-three JS chunk exceeds 400KB. vendor-three is the
          # first-person walkthrough renderer (three.js) and is budgeted at 600KB.
          max_size=409600
          three_max=614400
          for f in dist/assets/*.js; do
            size=$(wc -c < "$f")
            limit=$max_size
            case "$(basename "$f")" in
              vendor-three-*) limit=$three_max ;;
            esac
            if [ "$size" -gt "$limit" ]; then
              echo "::error::Bundle $(basename "$f") is ${size} bytes (limit: ${limit})"
              exit 1
            fi
          done
          echo "✅ All chunks within size budget"

  lockfile:
    name: Lockfile Validation (pnpm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify pnpm-lock.yaml is up to date
        run: pnpm install --frozen-lockfile

      - name: Fail if lockfile would change
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            echo "::error::pnpm-lock.yaml is out of date with package.json"
            echo "Run 'pnpm install' locally and commit the updated lockfile."
            exit 1
          fi
          echo "✅ pnpm-lock.yaml is in sync"
